<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - KLOÉ Beauty Salon</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #ff6b6b;
            --secondary-color: #4a4a4a;
            --light-bg: #f8f9fa;
        }

        body {
            padding-top: 76px;
        }

        .navbar {
            padding: 15px 0;
            background-color: rgba(255, 255, 255, 0.98) !important;
            box-shadow: 0 2px 15px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
        }

        .navbar-brand {
            font-size: 32px;
            font-weight: 800;
            color: var(--primary-color) !important;
            letter-spacing: 2px;
        }

        .nav-link {
            font-size: 16px;
            font-weight: 500;
            color: var(--dark-color) !important;
            margin: 0 15px;
            position: relative;
            transition: all 0.3s ease;
        }

        .nav-link::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--primary-color);
            transition: width 0.3s ease;
        }

        .nav-link:hover::after {
            width: 100%;
        }

        .contact-section {
            padding: 5rem 0;
            background: linear-gradient(135deg, #fff 0%, var(--light-bg) 100%);
        }

        .contact-info {
            position: relative;
            background: white;
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.05);
        }

        .progress {
            height: 8px;
            border-radius: 4px;
            margin-bottom: 1.5rem;
            background-color: #f0f0f0;
        }

        .progress-bar {
            background-color: var(--primary-color);
            transition: width 1s ease-in-out;
        }

        .progress-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.5rem;
            color: var(--secondary-color);
            font-weight: 500;
        }

        .contact-form {
            background: white;
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.05);
        }

        .form-control {
            padding: 0.8rem;
            border-radius: 8px;
            border: 1px solid #e0e0e0;
            transition: all 0.3s;
        }

        .form-control:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 0.2rem rgba(255,107,107,0.25);
        }

        .btn-primary {
            background-color: var(--primary-color);
            border: none;
            padding: 0.8rem 2rem;
            border-radius: 8px;
            font-weight: 500;
            transition: all 0.3s;
        }

        .btn-primary:hover {
            background-color: #ff5252;
            transform: translateY(-2px);
        }

        .section-title {
            color: var(--secondary-color);
            margin-bottom: 1rem;
            font-weight: 600;
        }

        .expertise-title {
            font-size: 1.75rem;
            margin-bottom: 2rem;
            color: var(--secondary-color);
            text-align: center;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg fixed-top">
        <div class="container">
            <a class="navbar-brand" href="#">PINKIÉS FLORIST</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="b1.html">About</a></li>
                    <li class="nav-item"><a class="nav-link active" href="#">Contact</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <section class="contact-section">
        <div class="container">
            <div class="row g-4">
                <!-- Our Expertise Section -->
                <div class="col-md-6">
                    <div class="contact-info">
                        <h2 class="expertise-title">Our Expertise</h2>
                        <div class="expertise-image">
                            <img src="bungaaa.jpg" alt="Expertise Image" class="img-fluid"> 
                        </div>
                        <div class="progress-item">
                            <div class="progress-label">
                                <span>Custom Bouquets</span>
                                <span>95%</span>
                            </div>
                            <div class="progress">
                                <div class="progress-bar" style="width: 90%"></div>
                            </div>
                        </div>
                        <div class="progress-item">
                            <div class="progress-label">
                                <span>Unique Flower Bouquet Creations</span>
                                <span>90%</span>
                            </div>
                            <div class="progress">
                                <div class="progress-bar" style="width: 85%"></div>
                            </div>
                        </div>
                    </div>
                </div>
                <!-- Get in Touch Section -->
                <div class="col-md-6">
                    <div class="contact-form">
                        <h2 class="section-title">Order Here</h2>
                        <form>
                            <div class="mb-3">
                                <input type="text" class="form-control" placeholder="Your Name">
                            </div>
                            <div class="mb-3">
                                <input type="email" class="form-control" placeholder="Your Email">
                            </div>
                            <div class="mb-4">
                                <textarea class="form-control" rows="5" placeholder="Your Message"></textarea>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Send Order</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </section>
    
    <style>
        .contact-section {
            padding: 4rem 0;
        }
    
        .contact-info,
        .contact-form {
            background-color: #ffffff;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            height: 100%;
        }
    
        .expertise-image {
            text-align: center;
            margin-bottom: 20px;
        }
    
        .expertise-image img {
            width: 250px; /* Atur lebar gambar */
            height: 200px; /* Atur tinggi gambar */
            object-fit: cover;
            border-radius: 8px;
        }
    
        .section-title,
        .expertise-title {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            text-align: center;
            color: #333333;
        }
    
        .form-control {
            border: 1px solid #ddd;
            padding: 1rem;
            border-radius: 8px;
            width: 100%;
        }
    
        .btn-primary {
            background-color: #ff6b6b;
            border: none;
            padding: 1rem;
            border-radius: 8px;
            font-weight: bold;
        }
    
        .btn-primary:hover {
            background-color: #ff5252;
        }
    </style>
    
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
